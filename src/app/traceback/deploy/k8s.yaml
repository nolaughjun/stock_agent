# 溯源分析系统 K8s 部署 (P4, 对齐 04_phase4_design.md §5)
# 包含: FastAPI Deployment(3副本) + Service + HPA + ConfigMap/Secret 占位
# 数据层(PG/Mongo/Redis/MinIO)与 Istio/Ingress 由独立 chart 管理, 此处聚焦应用。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traceback-api
  labels: {app: traceback, component: api}
spec:
  replicas: 3
  selector: {matchLabels: {app: traceback, component: api}}
  template:
    metadata:
      labels: {app: traceback, component: api}
      annotations:
        # Istio sidecar 注入 (mTLS/熔断/可观测)
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: api
          image: traceback:latest
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: traceback-config}
            - secretRef: {name: traceback-secret}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1000m", memory: "1Gi"}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: traceback-api
spec:
  selector: {app: traceback, component: api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: traceback-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: traceback-api}
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
# 异步分析 Worker (Celery/asyncio; P4 生产用 Celery, HPA 2~10)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traceback-worker
  labels: {app: traceback, component: worker}
spec:
  replicas: 2
  selector: {matchLabels: {app: traceback, component: worker}}
  template:
    metadata:
      labels: {app: traceback, component: worker}
      annotations: {sidecar.istio.io/inject: "true"}
    spec:
      containers:
        - name: worker
          image: traceback:latest
          command: ["python", "-m", "celery", "-A", "src.app.traceback.core.celery_app", "worker", "--concurrency=4"]
          envFrom:
            - configMapRef: {name: traceback-config}
            - secretRef: {name: traceback-secret}
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "2000m", memory: "2Gi"}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: traceback-worker}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: traceback-worker}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 75}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: traceback-config}
data:
  TASK_RUNNER: "celery"
  CHECKPOINT_BACKEND: "postgres"
  EVIDENCE_MOCK_MODE: "false"
  TZ: "Asia/Shanghai"
---
apiVersion: v1
kind: Secret
metadata: {name: traceback-secret}
type: Opaque
stringData:
  # 生产由 Vault/Sealed Secrets 注入, 勿提交真实值
  JWT_SECRET: "REPLACE_VIA_VAULT"
  DEEPSEEK_API_KEY: "REPLACE_VIA_VAULT"
  POSTGRES_DSN: "REPLACE_VIA_VAULT"
  MONGO_DSN: "REPLACE_VIA_VAULT"
  REDIS_URL: "REPLACE_VIA_VAULT"
---
# Prometheus ServiceMonitor (可观测, §4)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: traceback, labels: {release: prometheus}}
spec:
  selector: {matchLabels: {app: traceback}}
  endpoints: [{port: "", targetPort: 8000, path: /metrics, interval: 30s}]
